version: 2

models:
  - name: dim_branch
    description: One row per supermarket branch

    columns:
      - name: branch_key
        description: Surrogate key for the branch
        data_tests:
          - not_null
          - unique

      - name: branch
        description: Source branch identifier
        data_tests:
          - not_null
          - unique

      - name: city
        description: City where the branch is located
        data_tests:
          - not_null

  - name: dim_product_line
    description: One row per product-line category

    columns:
      - name: product_line_key
        description: Surrogate key for the product line
        data_tests:
          - not_null
          - unique

      - name: product_line
        description: Product-line name
        data_tests:
          - not_null
          - unique

  - name: dim_customer_segment
    description: One row per customer-type and gender combination

    columns:
      - name: customer_segment_key
        description: Surrogate key for the customer segment
        data_tests:
          - not_null
          - unique

      - name: customer_type
        description: Customer membership type
        data_tests:
          - not_null

      - name: gender
        description: Customer gender from the source data
        data_tests:
          - not_null

  - name: dim_payment
    description: One row per payment method

    columns:
      - name: payment_key
        description: Surrogate key for the payment method
        data_tests:
          - not_null
          - unique

      - name: payment
        description: Payment method
        data_tests:
          - not_null
          - unique

  - name: fact_sales
    description: One row per supermarket sales invoice

    columns:
      - name: invoice_id
        description: Unique invoice identifier from the source data
        data_tests:
          - not_null
          - unique

      - name: branch_key
        description: Foreign key to dim_branch
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_branch')
                field: branch_key

      - name: product_line_key
        description: Foreign key to dim_product_line
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product_line')
                field: product_line_key

      - name: customer_segment_key
        description: Foreign key to dim_customer_segment
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer_segment')
                field: customer_segment_key

      - name: payment_key
        description: Foreign key to dim_payment
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment')
                field: payment_key

      - name: date_key
        description: Foreign key to dim_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: time_key
        description: Foreign key to dim_time
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key